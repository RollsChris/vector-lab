<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Vector Lab — learn maths from zero to elite</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar" class="topbar">
        <button
          type="button"
          id="nav-toggle"
          class="chrome-btn"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          Lessons
        </button>
        <div class="topbar-title">
          <span class="topbar-brand">Vector Lab</span>
          <span id="topbar-lesson" class="topbar-lesson"></span>
        </div>
        <div class="topbar-actions">
          <button type="button" id="prev-lesson" class="chrome-btn icon" aria-label="Previous lesson">‹</button>
          <button type="button" id="next-lesson" class="chrome-btn icon" aria-label="Next lesson">›</button>
        </div>
      </header>

      <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>

      <aside id="control-dock" aria-label="Lesson controls" aria-hidden="true">
        <div class="control-dock-header">
          <span>Lesson controls</span>
          <button type="button" id="controls-close" class="control-dock-close">Hide</button>
        </div>
        <div id="control-dock-content" class="control-dock-content"></div>
      </aside>

      <aside id="sidebar">
        <div class="brand">
          Vector Lab
          <small>Zero to elite — a guided maths path</small>
        </div>
        <div id="section-switcher" class="section-switcher" role="tablist" aria-label="App section">
          <button
            type="button"
            role="tab"
            id="section-tab-lessons"
            class="section-tab active"
            data-section="lessons"
            aria-selected="true"
            aria-controls="lessons-chrome"
          >
            Lessons
          </button>
          <button
            type="button"
            role="tab"
            id="section-tab-investigations"
            class="section-tab"
            data-section="investigations"
            aria-selected="false"
            aria-controls="investigations-chrome"
          >
            Investigations
          </button>
        </div>
        <div id="lessons-chrome" role="tabpanel" aria-labelledby="section-tab-lessons">
          <div id="path-progress" class="path-progress"></div>
          <div class="nav-tools">
            <label for="lesson-search">Find a lesson</label>
            <input id="lesson-search" type="search" placeholder="Search lessons…  /" autocomplete="off" enterkeyhint="search" />
            <div id="lesson-count" class="nav-count"></div>
          </div>
          <nav id="nav" aria-label="Lessons"></nav>
        </div>
        <div
          id="investigations-chrome"
          class="inv-chrome-host"
          role="tabpanel"
          aria-labelledby="section-tab-investigations"
          hidden
        ></div>
      </aside>

      <main id="stage" aria-label="Interactive 3D lesson viewport">
        <div
          class="hint"
          data-hint-desktop="Drag to orbit · scroll to zoom · right-drag to pan · / search · [ ] lessons"
          data-hint-touch="Drag to orbit · pinch to zoom · two-finger pan · use Lessons / Lesson / Animate"
        >
          Drag to orbit · scroll to zoom · right-drag to pan · / search · [ ] lessons
        </div>
        <div id="investigations-stage" class="inv-stage-host" hidden></div>
      </main>

      <aside id="panel" aria-live="polite">
        <div class="panel-handle" id="panel-handle" aria-hidden="true"></div>
        <div id="lessons-panel">
          <div id="topic-tabs-desktop" class="topic-tabs" role="tablist" aria-label="Topic workspace">
            <button
              type="button"
              role="tab"
              id="panel-tab-lesson"
              class="topic-tab is-active"
              aria-selected="true"
              aria-controls="topic-lesson"
            >
              Lesson
            </button>
            <button
              type="button"
              role="tab"
              id="panel-tab-animate"
              class="topic-tab"
              aria-selected="false"
              aria-controls="topic-animate"
            >
              Animate
            </button>
          </div>
          <div id="topic-lesson" class="topic-pane is-active" role="tabpanel" aria-labelledby="panel-tab-lesson">
            <div id="lesson-meta"></div>
            <div class="lesson-pages" role="tablist" aria-label="Lesson pages">
              <button
                type="button"
                role="tab"
                id="page-learn"
                class="lesson-page-tab is-active"
                aria-selected="true"
                aria-controls="lesson-learn"
              >
                Learn
              </button>
              <button
                type="button"
                role="tab"
                id="page-practice"
                class="lesson-page-tab"
                aria-selected="false"
                aria-controls="lesson-practice-page"
              >
                Practice
              </button>
            </div>
            <div id="lesson-learn" class="lesson-page" role="tabpanel" aria-labelledby="page-learn">
              <div id="lesson-brief"></div>
              <div id="info"></div>
            </div>
            <div id="lesson-practice-page" class="lesson-page" role="tabpanel" aria-labelledby="page-practice" hidden>
              <div id="lesson-practice"></div>
            </div>
          </div>
          <div id="topic-animate" class="topic-pane" role="tabpanel" aria-labelledby="panel-tab-animate" hidden>
            <div id="gui"></div>
          </div>
        </div>
        <div id="investigations-panel" class="inv-panel-host" hidden></div>
      </aside>

      <nav id="topic-tabbar" class="topic-tabbar" aria-label="Topic workspace">
        <button
          type="button"
          role="tab"
          id="tabbar-lesson"
          class="topic-tab is-active"
          aria-selected="true"
          aria-controls="panel"
        >
          Lesson
        </button>
        <button
          type="button"
          role="tab"
          id="tabbar-animate"
          class="topic-tab"
          aria-selected="false"
          aria-controls="control-dock"
        >
          Animate
        </button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
